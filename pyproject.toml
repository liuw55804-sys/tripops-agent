[project]
name = "tripops-agent"
version = "0.1.0"
description = "Constraint-driven multi-agent travel planning and disruption recovery"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-mcp-adapters>=0.2,<1.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=2.0,<4.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.1,<2.0",
    "sse-starlette>=3.0,<4.0",
    "structlog>=25.0,<26.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
rag = [
    "langchain-milvus>=0.3,<1.0",
    "pymilvus>=2.6,<3.0",
    "rank-bm25>=0.2.2,<1.0",
    "sentence-transformers>=5.0,<6.0",
]
mcp = ["fastmcp>=2.12,<3.0"]
dev = [
    "coverage[toml]>=7.10,<8.0",
    "mypy>=1.17,<2.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "pytest-cov>=6.2,<7.0",
    "ruff>=0.12,<1.0",
    "types-pyyaml>=6.0,<7.0",
]

[project.scripts]
tripops-api = "tripops.api.main:run"
tripops-eval = "tripops.evaluation.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripops"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["tripops"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tripops"]
